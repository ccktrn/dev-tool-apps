name: app_novelviewer
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  hooks_riverpod: ^2.5.1 # globalStateControll
  riverpod_annotation: ^2.3.5
  flutter_hooks: ^0.20.5 # localStateControll
  # package_info_plus: ^6.0.0
  intl: ^0.19.0
  sqflite: ^2.2.8+1 # database
  shared_preferences: ^2.2.2 # local data
  path:
  path_provider: ^2.1.3
  html: ^0.15.0
  http: ^0.13.1
  url_launcher: ^6.0.18
  receive_sharing_intent: ^1.5.4 
  yaml:
  webview_flutter: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  sqflite_common_ffi_web: '>=0.1.0-dev.1'
  
  build_runner: ^2.4.9 #code-gen 
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: "^0.9.2"
  # flutter_native_splash: ^2.1.3+1



# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  
  assets: # To add assets to your application
    - assets/icon/icon_1024.png
    - assets/config/novelsites.yaml


  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700

flutter_icons:
  android: true
  adaptive_icon_foreground: "assets/icon/icon_adaptive.png"
  adaptive_icon_background: "#E9DBF7"

  ios: true
  image_path: "assets/icon/icon_1024.png"
  remove_alpha_ios: true
  
